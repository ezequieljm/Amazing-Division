<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Demo - Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calculator-container">
        <h2>Amazing Safe Division!</h2>
        
        <div class="form-group">
            <label for="numerator">Numerator</label>
            <input type="number" id="numerator" placeholder="e.g., 10">
        </div>

        <div class="form-group">
            <label for="denominator">Denominator</label>
            <input type="number" id="denominator" placeholder="e.g., 2">
        </div>

        <button id="btnCalculate">Calculate Result</button>

        <div id="result-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
